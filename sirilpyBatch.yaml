Batches:
  Default:
  - config: {}
    plugin: sorter
  - config:
      cfa: false
      debayer: false
      equalize_cfa: false
      sigma:
      - 3
      - 3
    plugin: calibrate
  - config:
      gpu: true
      model: 3.0.2
      strength: 0.5
    plugin: graxpert_denoise
  - config:
      correction: subtraction
      gpu: true
      model: 1.0.1
      smoothing: 0.5
    plugin: graxpert_bge
telescope:
  filter:
  - No Filter
  - No Filter (Broadband)
  focalLen: 335
  name: Celestron Origin Smart Mark 2
  pixelSize: 2.0
  sensor: Sony IMX678
